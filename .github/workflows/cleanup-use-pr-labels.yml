name: Cleanup use-pr labels on PR close

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup-use-pr-labels:
    # Run for any closed PR (merged or not).
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Remove unused use-pr-* labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const labelPattern = /^use-pr-\d+$/;

            const labels = (pr.labels || [])
              .map(l => l.name)
              .filter(name => labelPattern.test(name));

            if (labels.length === 0) {
              core.info("No use-pr-* labels on this PR.");
              return;
            }

            for (const label of labels) {
              const openItems = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "open",
                labels: label,
                per_page: 100
              });

              const openPrCount = openItems.filter(item => !!item.pull_request).length;

              if (openPrCount === 0) {
                try {
                  await github.rest.issues.deleteLabel({ owner, repo, name: label });
                  core.info(`Deleted label: ${label}`);
                } catch (error) {
                  if (error.status === 404) {
                    core.info(`Label already removed: ${label}`);
                  } else {
                    throw error;
                  }
                }
              } else {
                core.info(`Keeping label ${label} (still used by ${openPrCount} open PR(s)).`);
              }
            }